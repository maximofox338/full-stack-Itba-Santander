<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Imágenes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Mi Galería</h1>

  <div class="galeria">
    <div class="tarjeta-foto">
      <img src="Foto_Perfil.jpeg" alt="Foto de perfil">
      <p>Mi foto de perfil</p>
    </div>
    <div class="tarjeta-foto">
      <img src="Milanesa_fideos.jpg" alt="Plato de milanesa con fideos">
      <p>Milanesa con fideos</p>
    </div>
    <div class="tarjeta-foto">
      <img src="K2.jpg" alt="La montaña K2">
      <p>El K2, segunda montaña más alta</p>
    </div>
  </div>
</body>
</html>
