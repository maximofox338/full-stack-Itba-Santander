<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de muebles</title>
</head>
<body>

    <h1>Catálogo de muebles</h1>

    <div id="product-container"></div>

    <button class="boton-favorito">❤️ Añadir a Favoritos</button>

    <script src="app.js"></script>

    <button id="btn-guardar">Guardar preferencias</button>
    <button id="btn-cargar">Cargar preferencias</button>

    <form id="form-busqueda">
        <input
            type="text"
            id="input-usuario"
            placeholder="Nombre de usuario">
        <button type="submit">Buscar usuario</button>
    </form>

    <div id="resultado-usuario"></div>

    <div id="galeria"></div>
</body>
</html>
